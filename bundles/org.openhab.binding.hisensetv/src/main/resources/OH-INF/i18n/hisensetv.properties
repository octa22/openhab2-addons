# add-on

addon.hisensetv.name = Hisense TV Binding
addon.hisensetv.description = Controls compatible Hisense televisions using their local MQTT service.

# thing types

thing-type.hisensetv.tv.label = Hisense TV
thing-type.hisensetv.tv.description = A Hisense television with a RemoteNOW MQTT service.

# thing types config

thing-type.config.hisensetv.tv.certificateFingerprint.label = Certificate Fingerprint
thing-type.config.hisensetv.tv.certificateFingerprint.description = The SHA-256 fingerprint of the TV certificate, with optional colon separators. Set this for a self-signed certificate.
thing-type.config.hisensetv.tv.host.label = Host
thing-type.config.hisensetv.tv.host.description = The hostname or IP address of the TV.
thing-type.config.hisensetv.tv.password.label = MQTT Password
thing-type.config.hisensetv.tv.password.description = Overrides the TV's standard MQTT password.
thing-type.config.hisensetv.tv.port.label = MQTT Port
thing-type.config.hisensetv.tv.port.description = The port of the MQTT broker on the TV.
thing-type.config.hisensetv.tv.refreshInterval.label = Refresh Interval
thing-type.config.hisensetv.tv.refreshInterval.description = Interval for polling the volume in seconds.
thing-type.config.hisensetv.tv.remoteId.label = Remote ID
thing-type.config.hisensetv.tv.remoteId.description = Remote app identity used for pairing. The default matches newAM/hisensetv.
thing-type.config.hisensetv.tv.tls.label = Use TLS
thing-type.config.hisensetv.tv.tls.description = Use TLS to connect to the TV's MQTT broker.
thing-type.config.hisensetv.tv.username.label = MQTT Username
thing-type.config.hisensetv.tv.username.description = Overrides the TV's standard MQTT username.

# channel types

channel-type.hisensetv.key.label = Remote Key
channel-type.hisensetv.key.description = Sends a remote control key such as KEY_POWER, KEY_HOME or KEY_OK.
channel-type.hisensetv.source.label = Select Input
channel-type.hisensetv.source.description = Selects a TV input by its source ID.
channel-type.hisensetv.sources.label = Available Inputs
channel-type.hisensetv.sources.description = The list of TV inputs as JSON.
channel-type.hisensetv.volume.label = Volume
channel-type.hisensetv.volume.description = The volume level of the TV.

# thing status descriptions

offline.configuration-error = Check the TV host, port, polling interval, remote ID, and TLS fingerprint.
offline.mqtt-disconnected = Disconnected from the TV's MQTT broker.
